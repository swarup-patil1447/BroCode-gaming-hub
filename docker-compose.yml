services:
  postgres:
    image: postgres:15-alpine
    container_name: brocode-postgres
    restart: always
    environment:
      POSTGRES_USER: brocode
      POSTGRES_PASSWORD: brocode_password_2026
      POSTGRES_DB: brocode
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
